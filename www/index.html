<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14204a">
<meta name="description" content="Lernhelfer für Brander- und Burschenprüfung der K.a.V. Bajuvaria – Fuchsenskript, Komment, Quiz, Karteikarten und Prüfungsmodus.">
<title>Fuchsenskript Lernapp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">

</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <div class="topbar-title" id="topTitle">Fuchsenskript</div>

  </header>
  <div class="band-strip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<div id="modal" class="modal" hidden></div>

<script src="data/skript.js"></script>
<script src="data/content-brander.js"></script>
<script src="data/content-burschen.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
