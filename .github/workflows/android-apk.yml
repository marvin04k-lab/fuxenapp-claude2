name: Android-APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || echo "Kein Android SDK gefunden"

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: App-Icons erzeugen
        run: npm run icons
        continue-on-error: true

      - name: Web-Inhalte synchronisieren
        run: npx cap sync android

      - name: Debug-APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v5
        with:
          name: Fuchsenskript-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
